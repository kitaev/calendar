<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple&nbsp;Calendar</title>

    <link rel="shortcut icon" href="calendar.png">
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.1.1/css/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

    <!-- Local CSS -->
    <link rel="stylesheet" href="css/main.css" />
    <!-- Local JavaScript -->
    <script src="js/date.js" ></script>
    <script src="js/main.js" ></script>
</head>

<body>
    <div class="container">
        <div class="header"><h3 class="text-muted">Simple Calendar</h3></div>

        <div id="jumbo" class="jumbotron">
            <div id="dateandtime" style="display:block;">
                <h1><span id="date"></span></h1>
                <h2><span id="time"></span></h2>
                <h3><small>click for more</small></h3>
            </div>
            <div id="calendar" style="display:none;">
                <div class="text-center h3" id="month-header"></div>
                <table class="table table-bordered">
                    <thead><tr>
                        <th class="text-center">Mon</th>
                        <th class="text-center">Tue</th>
                        <th class="text-center">Wed</th>
                        <th class="text-center">Thu</th>
                        <th class="text-center">Fri</th>
                        <th class="text-center text-danger">Sat</th>
                        <th class="text-center text-danger">Sun</th>
                    </tr></thead>
                    <tbody id="month-table"></tbody>
                </table>
                <h3><small>click for less</small></h3>
            </div>
        </div>

        <div class="footer">
            <div class="footer-bar">
                <button type="button" id="share" class="btn btn-link" title="Share this page" aria-label="Share this page">
                    <i id="share-icon" class="fa fa-share-alt fa-lg" aria-hidden="true"></i>
                </button>
                <div class="text-muted small">&copy; <a class="text-muted" href="https://kitayev.online/">Alexander Kitayev</a> 2014&ndash;<span id="copyright-year">2026</span></div>
            </div>
        </div>
    </div>
</body>
</html>
